# Cloudflare Worker config for the MacroLog Claude proxy.
# See README.md in this folder for the full setup walkthrough.

name = "macrolog-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

# Per-person monthly spend cap in USD (requests are rejected past it).
[vars]
MONTHLY_COST_CAP_USD = "10"

# KV namespace holding invite codes and usage counters.
# Created by `wrangler kv namespace create USERS` — paste the id it prints.
[[kv_namespaces]]
binding = "USERS"
id = "9e0ca0df256c4d538b8d8d7bada55f59"

# Shared community food/recipe database (D1, SQLite).
# Created by `wrangler d1 create macrolog-foods` — paste the id it prints.
[[d1_databases]]
binding = "FOODDB"
database_name = "macrolog-foods"
database_id = "78566f3c-62e1-41b6-a0ab-71cb54e75450"

# Secrets (set via `wrangler secret put …`, never in this file):
#   ANTHROPIC_API_KEY — your Claude API key
#   ADMIN_TOKEN       — any long random string; guards the /admin endpoints
