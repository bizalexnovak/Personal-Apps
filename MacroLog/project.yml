name: MacroLog
options:
  bundleIdPrefix: com.alexnovak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

# Signing lives in an xcconfig so the Team ID survives `xcodegen generate`
# (which rewrites the .xcodeproj and would otherwise drop it). Targets inherit
# these project-level settings.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

targets:
  MacroLog:
    type: application
    platform: iOS
    sources:
      - MacroLog
      - Shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: MacroLog.entitlements
    info:
      path: MacroLog/Info.plist
      properties:
        CFBundleDisplayName: MacroLog
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: MacroLog uses the microphone to hear you describe your meal.
        NSSpeechRecognitionUsageDescription: MacroLog transcribes your meal description so it can be parsed and logged.
        NSCameraUsageDescription: MacroLog uses the camera to read nutrition facts labels you photograph.
    dependencies:
      - target: MacroLogWidgetExtension

  MacroLogWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - MacroLogWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexnovak.MacroLog.Widget
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_ENTITLEMENTS: MacroLogWidget.entitlements
    info:
      path: MacroLogWidget/Info.plist
      properties:
        CFBundleDisplayName: MacroLog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MacroLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MacroLogTests
    dependencies:
      - target: MacroLog

schemes:
  MacroLog:
    build:
      targets:
        MacroLog: all
        MacroLogWidgetExtension: all
        MacroLogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacroLogTests
