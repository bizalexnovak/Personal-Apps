name: MacroLog
options:
  bundleIdPrefix: com.alexnovak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MacroLog:
    type: application
    platform: iOS
    sources:
      - MacroLog
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: MacroLog/Info.plist
      properties:
        CFBundleDisplayName: MacroLog
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: MacroLog uses the microphone to hear you describe your meal.
        NSSpeechRecognitionUsageDescription: MacroLog transcribes your meal description so it can be parsed and logged.
        NSCameraUsageDescription: MacroLog uses the camera to read nutrition facts labels you photograph.

  MacroLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MacroLogTests
    dependencies:
      - target: MacroLog

schemes:
  MacroLog:
    build:
      targets:
        MacroLog: all
        MacroLogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacroLogTests
