name: MindLog
options:
  bundleIdPrefix: com.alexnovak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MindLog:
    type: application
    platform: iOS
    sources:
      - MindLog
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: MindLog/MindLog.entitlements
    info:
      path: MindLog/Info.plist
      properties:
        CFBundleDisplayName: MindLog
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: MindLog uses the microphone so you can speak your journal entries out loud.
        NSSpeechRecognitionUsageDescription: MindLog transcribes what you say into a journal entry. On-device recognition is used whenever your language supports it, so your words stay on this phone.
        NSHealthShareUsageDescription: MindLog can read your sleep and step count so a day's mood sits next to how you slept and moved. It's read on this phone, shown only to you, and never leaves the device.
    dependencies:
      - target: MindLogWidgetExtension

  # Lock-screen and home-screen check-in widgets. The extension shares the App
  # Group SwiftData store with the app (see AppModelContainer) and compiles
  # only the model + check-in files it needs, not the whole app source tree.
  MindLogWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - MindLogWidget
      - path: MindLog/Models/JournalEntry.swift
      - path: MindLog/Models/ActivityLog.swift
      - path: MindLog/Models/ActivityCatalog.swift
      - path: MindLog/Models/AppModelContainer.swift
      - path: MindLog/Models/EmotionVocabulary.swift
      - path: MindLog/Services/CheckInWriter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexnovak.MindLog.Widget
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_ENTITLEMENTS: MindLogWidget/MindLogWidget.entitlements
    info:
      path: MindLogWidget/Info.plist
      properties:
        CFBundleDisplayName: MindLog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MindLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MindLogTests
    dependencies:
      - target: MindLog

schemes:
  MindLog:
    build:
      targets:
        MindLog: all
        MindLogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MindLogTests
